[package]
name = "usvc-cli"
version = "0.1.0"
edition = "2021"
description = "Headless runner for the uSVC emulator"
license = "GPL-3.0-or-later"
repository = "https://github.com/mwulffn/usvc-devkit"

[[bin]]
name = "usvc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
png = "0.18.1"
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"], optional = true }
usvc-core = { path = "../usvc-core" }

[features]
default = ["window"]
# The SDL window, sound and live input. Without it the binary is headless only.
window = ["dep:sdl2"]
